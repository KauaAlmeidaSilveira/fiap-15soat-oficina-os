spring.profiles.active=test

# JWT
jwt.public.key=classpath:jwt.public.key
jwt.issuer=http://localhost:8080

# Datasource
spring.datasource.url=jdbc:h2:mem:oficina_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=false

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

servico.jwt.public.key=classpath:servico.public.key
servico.jwt.private.key=classpath:servico.private.key
app.execucao.base-url=http://localhost:1
app.saga.prazo-etapa=PT30M
app.saga.prazo-decisao=P7D
app.saga.margem-qr=PT5M
app.mensageria.habilitada=false
app.mensageria.fila-eventos=oficina-os-saga-eventos
app.mensageria.fila-billing=oficina-billing-comandos
app.mensageria.fila-execucao=oficina-execucao-comandos
spring.cloud.aws.sqs.enabled=false
spring.cloud.aws.region.static=us-east-1
