spring.application.name=oficina-os

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oficina_os}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:oficina}
spring.datasource.password=${DB_PASSWORD:oficina123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console desabilitado
spring.h2.console.enabled=false

# Server
server.port=8080

# Actuator / metricas
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
jwt.public.key=${JWT_PUBLIC_KEY:classpath:jwt.public.key}
jwt.issuer=${JWT_ISSUER:http://localhost:8080}


# Par de chaves com que este servico se identifica ao chamar a Execucao
servico.jwt.public.key=${SERVICO_JWT_PUBLIC_KEY:classpath:servico.public.key}
servico.jwt.private.key=${SERVICO_JWT_PRIVATE_KEY:classpath:servico.private.key}
app.execucao.base-url=${EXECUCAO_BASE_URL:http://localhost:8082}

# Saga
app.saga.prazo-etapa=${SAGA_PRAZO_ETAPA:PT30M}
app.saga.prazo-decisao=${SAGA_PRAZO_DECISAO:P7D}
app.saga.margem-qr=${SAGA_MARGEM_QR:PT5M}

# Mensageria
app.mensageria.habilitada=${APP_MENSAGERIA_HABILITADA:true}
app.mensageria.fila-eventos=${FILA_SAGA_EVENTOS:oficina-os-saga-eventos}
app.mensageria.fila-billing=${FILA_BILLING_COMANDOS:oficina-billing-comandos}
app.mensageria.fila-execucao=${FILA_EXECUCAO_COMANDOS:oficina-execucao-comandos}
spring.cloud.aws.sqs.enabled=${APP_MENSAGERIA_HABILITADA:true}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
